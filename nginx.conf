server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — todas as rotas apontam para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache longo para assets com hash no nome
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Desativa exposição da versão do Nginx
    server_tokens off;
}